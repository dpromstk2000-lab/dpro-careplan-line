<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2942"><meta name="robots" content="noindex,nofollow"><title>DPRO 居宅介護支援｜ケアマネ実務画面</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="staff.css"></head><body><header class="hero staff-hero"><div class="wrap"><div class="brand"><span class="brand-mark">D</span><span><strong>DPRO CARE PLAN</strong><small>ケアマネジャー実務画面</small></span></div><div class="hero-copy"><p class="eyebrow">TODAY・CLIENTS・MONITORING・COORDINATION</p><h1>今日の訪問から、<br>モニタリング・連絡調整まで。</h1><div class="hero-links"><a class="hero-link ghost" href="index.html">← LINE入口へ戻る</a><a class="hero-link ghost" href="owner.html">管理者画面</a></div></div></div></header><main class="main"><div class="wrap staff-wrap"><div id="status" class="status" role="alert" aria-live="polite"></div><section id="loginPanel" class="card login-box"><h2>ケアマネログイン</h2><p class="hint">担当利用者、訪問予定、タスク、モニタリング、関係事業所との連絡履歴を確認します。</p><form id="loginForm"><div class="field"><label for="organizationCode">事業所コード</label><input class="control" id="organizationCode" maxlength="64"></div><div class="field"><label for="staffCode">職員コード</label><input class="control" id="staffCode" maxlength="64"></div><div class="field"><label for="accessCode">管理コード</label><div class="code-row"><input class="control" id="accessCode" type="password" inputmode="numeric" maxlength="128"><button id="clearCode" class="clear-btn" type="button">削除</button></div></div><div class="button-row"><button id="demoFill" class="btn secondary" type="button">デモ情報を入力</button><button id="loginButton" class="btn primary" type="submit">ログイン</button></div></form></section><section id="appPanel" class="hidden"><div class="staff-topbar card"><div><span class="badge">認証済み</span><div id="staffName" class="profile-name"></div><p id="staffMeta" class="muted"></p></div><div class="topbar-actions"><button id="refreshAll" class="btn secondary" type="button">再読込</button><button id="logout" class="btn danger" type="button">ログアウト</button></div></div><nav class="staff-nav" aria-label="業務メニュー"><button type="button" data-view="today" class="active">今日</button><button type="button" data-view="clients">担当利用者</button><button type="button" data-view="detail" disabled>利用者詳細</button></nav><section id="viewToday" class="staff-view"><div id="summaryGrid" class="summary-grid"></div><div class="staff-columns"><section class="card staff-panel"><div class="section-head"><h2>今日の訪問・面談</h2><span id="appointmentCount" class="count"></span></div><div id="appointmentList"></div></section><section class="card staff-panel"><div class="section-head"><h2>自分のタスク</h2><span id="taskCount" class="count"></span></div><div id="taskList"></div></section><section class="card staff-panel"><div class="section-head"><h2>期限・警告</h2><span id="alertCount" class="count"></span></div><div id="alertList"></div></section><section class="card staff-panel"><div class="section-head"><h2>申し送り</h2><span id="handoffCount" class="count"></span></div><div id="handoffList"></div></section></div></section><section id="viewClients" class="staff-view hidden"><section class="card"><div class="section-head"><h2>担当利用者</h2><span id="clientCount" class="count"></span></div><form id="searchForm" class="search-row"><input id="clientSearch" class="control" maxlength="100" placeholder="氏名・利用者番号・電話番号"><button class="btn primary" type="submit">検索</button><button id="clearSearch" class="btn secondary" type="button">解除</button></form><div id="clientList" class="client-grid"></div></section></section><section id="viewDetail" class="staff-view hidden"><div class="detail-head card"><div><button id="backClients" class="text-button" type="button">← 利用者一覧へ</button><h2 id="detailClientName"></h2><p id="detailClientMeta" class="muted"></p></div><span id="detailCareBadge" class="care-badge"></span></div><div id="clientSafety" class="safety-box hidden"></div><div class="detail-grid"><section class="card detail-card"><h2>基本・認定・計画</h2><div id="basicInfo"></div></section><section class="card detail-card"><h2>家族・利用サービス</h2><div id="familyServices"></div></section><section class="card detail-card wide"><div class="section-head"><h2>予定・過去記録</h2></div><div id="detailAppointments"></div></section><section class="card detail-card wide"><div class="section-head"><h2>モニタリング</h2><button id="newMonitoring" class="btn primary" type="button">今月分を入力</button></div><div id="monitoringList"></div><form id="monitoringForm" class="subform hidden"><input type="hidden" id="monitoringExpectedVersion"><div class="form-grid"><div class="field"><label for="monitoringMonth">対象月</label><input class="control" id="monitoringMonth" type="month" required></div><div class="field"><label for="monitoringMethod">実施方法</label><select class="control" id="monitoringMethod"><option value="home_visit">自宅訪問</option><option value="office">来所</option><option value="phone">電話</option><option value="online">オンライン</option><option value="other">その他</option></select></div><div class="field"><label for="visitStartedAt">開始</label><input class="control" id="visitStartedAt" type="datetime-local" step="1800"></div><div class="field"><label for="visitEndedAt">終了</label><input class="control" id="visitEndedAt" type="datetime-local" step="1800"></div></div><div class="field"><label for="conditionSummary">生活・心身状態</label><textarea class="control" id="conditionSummary" maxlength="4000"></textarea></div><div class="field"><label for="serviceEvaluation">サービス利用・評価</label><textarea class="control" id="serviceEvaluation" maxlength="4000"></textarea></div><div class="form-grid"><div class="field"><label for="clientWishes">本人の意向</label><textarea class="control compact" id="clientWishes" maxlength="4000"></textarea></div><div class="field"><label for="familyWishes">家族の意向</label><textarea class="control compact" id="familyWishes" maxlength="4000"></textarea></div></div><div class="field"><label for="issues">課題</label><textarea class="control compact" id="issues" maxlength="4000"></textarea></div><div class="field"><label for="nextActions">次の対応</label><textarea class="control compact" id="nextActions" maxlength="4000"></textarea></div><div class="field internal-field"><label for="internalHandoff">内部申し送り</label><textarea class="control compact" id="internalHandoff" maxlength="4000"></textarea><p class="hint">利用者・家族ポータルには表示されません。</p></div><div class="field family-field"><label for="familyPublicSummary">家族公開要約</label><textarea class="control compact" id="familyPublicSummary" maxlength="4000"></textarea></div><div class="button-row"><button id="saveDraft" class="btn secondary" type="button">下書き保存</button><button id="submitMonitoring" class="btn primary" type="submit">提出する</button><button id="cancelMonitoring" class="btn danger" type="button">閉じる</button></div></form></section><section class="card detail-card"><div class="section-head"><h2>関係事業所との連絡</h2><button id="newCoordination" class="btn secondary" type="button">連絡を記録</button></div><div id="coordinationList"></div><form id="coordinationForm" class="subform hidden"><div class="field"><label for="providerId">関係事業所</label><select class="control" id="providerId"><option value="">事業所を選択しない</option></select></div><div class="form-grid"><div class="field"><label for="coordDirection">方向</label><select class="control" id="coordDirection"><option value="outgoing">こちらから</option><option value="incoming">先方から</option><option value="internal">内部連絡</option></select></div><div class="field"><label for="coordChannel">方法</label><select class="control" id="coordChannel"><option value="phone">電話</option><option value="fax">FAX</option><option value="email">メール</option><option value="line">LINE</option><option value="meeting">会議</option><option value="visit">訪問</option><option value="mail">郵送</option><option value="other">その他</option></select></div></div><div class="field"><label for="coordOccurredAt">連絡日時</label><input class="control" id="coordOccurredAt" type="datetime-local"></div><div class="field"><label for="coordSubject">件名</label><input class="control" id="coordSubject" maxlength="200" required></div><div class="field"><label for="coordSummary">内容</label><textarea class="control compact" id="coordSummary" maxlength="4000" required></textarea></div><div class="field"><label for="coordNextAction">次の対応</label><textarea class="control compact" id="coordNextAction" maxlength="2000"></textarea></div><div class="form-grid"><div class="field"><label for="coordDueAt">対応期限</label><input class="control" id="coordDueAt" type="datetime-local"></div><div class="field"><label for="coordVisibility">公開範囲</label><select class="control" id="coordVisibility"><option value="internal">内部のみ</option><option value="family_public">家族へ公開</option></select></div></div><div class="button-row"><button class="btn primary" type="submit">保存</button><button id="cancelCoordination" class="btn danger" type="button">閉じる</button></div></form></section><section class="card detail-card"><div class="section-head"><h2>内部申し送り</h2><button id="newHandoff" class="btn secondary" type="button">申し送り作成</button></div><div id="detailHandoffs"></div><form id="handoffForm" class="subform hidden"><div class="field"><label for="handoffTo">宛先</label><select class="control" id="handoffTo"><option value="">役割宛て・指定なし</option></select></div><div class="form-grid"><div class="field"><label for="handoffPriority">優先度</label><select class="control" id="handoffPriority"><option value="normal">通常</option><option value="high">高</option><option value="urgent">緊急</option></select></div><div class="field"><label for="handoffVisibility">公開範囲</label><select class="control" id="handoffVisibility"><option value="internal">内部</option><option value="chief_manager">主任ケアマネ以上</option><option value="manager">管理者のみ</option></select></div></div><div class="field"><label for="handoffTitle">件名</label><input class="control" id="handoffTitle" maxlength="200" required></div><div class="field"><label for="handoffBody">内容</label><textarea class="control compact" id="handoffBody" maxlength="4000" required></textarea></div><div class="field"><label for="handoffDueAt">期限</label><input class="control" id="handoffDueAt" type="datetime-local"></div><div class="button-row"><button class="btn primary" type="submit">保存</button><button id="cancelHandoff" class="btn danger" type="button">閉じる</button></div></form></section></div></section></section></div></main><footer class="footer"><span id="version"></span></footer><script src="config.js"></script><script src="common.js"></script><script src="staff.js"></script></body></html>
