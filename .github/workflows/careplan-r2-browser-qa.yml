name: CAREPLAN R2 Fresh Browser QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/careplan-r2-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careplan-r2-browser-qa
  cancel-in-progress: false

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Fresh Chromium and public HTTP QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p CAREPLAN_R2_QA/screens
          cat > careplan-r2-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const demo='https://dpromstk2000-lab.github.io/dpro-careplan-line';
          const product='https://dpromstk2000-lab.github.io/dpro-line-systems-site';
          const official='https://dpro-shop.com/systems/careplan';
          const worker='https://dpro-careplan-line-api.dpromstk2000.workers.dev';
          const stamp=Date.now();
          const cases=[
            {item:'READY-018',name:'PC 1440',url:`${demo}/owner.html?r2qa=${stamp}`,width:1440,height:1000},
            {item:'READY-019',name:'Mobile 390',url:`${demo}/member.html?r2qa=${stamp}`,width:390,height:844,customer:true},
            {item:'READY-020',name:'Mobile 320',url:`${demo}/staff.html?r2qa=${stamp}`,width:320,height:720},
            {item:'READY-021',name:'iPad 1024',url:`${demo}/owner-ipad.html?r2qa=${stamp}`,width:1024,height:768},
          ];
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const browser=await chromium.launch({headless:true});
          const results=[];
          for(const c of cases){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},locale:'ja-JP',timezoneId:'Asia/Tokyo',colorScheme:'light'});
            const page=await ctx.newPage();
            const pageErrors=[],consoleErrors=[],requestFailures=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),failure:r.failure()?.errorText||''}));
            let status=null,loadError=null;
            try{
              const r=await page.goto(c.url,{waitUntil:'networkidle',timeout:60000});
              status=r?.status()??null;
            }catch(e){loadError=String(e)}
            await page.waitForTimeout(1500);
            const metrics=await page.evaluate(()=>({
              innerWidth,
              scrollWidth:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),
              text:(document.body?.innerText||''),
              title:document.title,
            }));
            const blockingTechnical=/SUPABASE_SERVICE_ROLE_KEY|SESSION_SECRET|service_role|-----BEGIN PRIVATE KEY-----|TypeError|ReferenceError|SyntaxError|Unhandled Promise/i.test(metrics.text);
            const secret=/SUPABASE_SERVICE_ROLE_KEY|SESSION_SECRET|service_role|eyJ[a-zA-Z0-9_-]{20,}\./i.test(metrics.text);
            const customerWordingOk=!c.customer || !/Cloudflare|Supabase|Worker API|service_role|SESSION_SECRET|Repository/i.test(metrics.text);
            const shot=`CAREPLAN_R2_QA/screens/${c.item}.png`;
            await page.screenshot({path:shot,fullPage:true});
            const pass=status===200 && !loadError && metrics.scrollWidth<=metrics.innerWidth+2 && pageErrors.length===0 && consoleErrors.length===0 && requestFailures.length===0 && !blockingTechnical && !secret && customerWordingOk;
            results.push({...c,status,loadError,metrics:{...metrics,text:metrics.text.slice(0,12000)},pageErrors,consoleErrors,requestFailures,blockingTechnical,secret,customerWordingOk,screenshotSha256:sha(shot),pass});
            await ctx.close();
          }
          await browser.close();

          async function fetchResult(name,url,options={}){
            try{
              const r=await fetch(url,{redirect:'follow',...options});
              const bytes=(await r.arrayBuffer()).byteLength;
              return {name,url,status:r.status,contentType:r.headers.get('content-type')||'',bytes,allowOrigin:r.headers.get('access-control-allow-origin')||'',pass:r.status===200};
            }catch(e){return{name,url,error:String(e),pass:false}}
          }
          const http=[];
          http.push(await fetchResult('worker_health',`${worker}/health`,{headers:{Origin:'https://dpromstk2000-lab.github.io'}}));
          http.push(await fetchResult('worker_version',`${worker}/version`,{headers:{Origin:'https://dpromstk2000-lab.github.io'}}));
          http.push(await fetchResult('product_site',`${product}/systems/careplan.html`));
          http.push(await fetchResult('live_demo',`${demo}/owner.html`));
          http.push(await fetchResult('sales_lp',`${product}/lp-careplan.html`));
          http.push(await fetchResult('a4_html',`${product}/flyer-careplan.html`));
          http.push(await fetchResult('a4_pdf',`${product}/flyer-careplan.pdf`));
          http.push(await fetchResult('official_site',official));
          const denied=await fetchResult('cors_denied',`${worker}/health`,{headers:{Origin:'https://evil.example'}});
          denied.pass=denied.status===403 && denied.allowOrigin!=='*'; http.push(denied);
          const allowed=http.find(x=>x.name==='worker_health');
          if(allowed) allowed.pass=allowed.status===200 && allowed.allowOrigin==='https://dpromstk2000-lab.github.io';

          const report={checkedAt:new Date().toISOString(),sourceHead:process.env.GITHUB_SHA,results,http,ok:results.every(x=>x.pass)&&http.every(x=>x.pass)};
          fs.writeFileSync('CAREPLAN_R2_QA/BROWSER_QA.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!report.ok) process.exitCode=1;
          JS
          node careplan-r2-qa.mjs

      - name: Upload R2 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careplan-r2-browser-runtime-qa
          path: CAREPLAN_R2_QA/
          if-no-files-found: error
          retention-days: 30
