name: CAREPLAN Tutorial R3 First10 QA

on:
  push:
    branches: [main]
    paths:
      - 'tutorial.html'
      - 'dpro-tutorial-core.js'
      - 'dpro-tutorial-first10-data.js'
      - 'dpro-tutorial.css'
      - '.github/workflows/careplan-tutorial-r3-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careplan-tutorial-r3-qa
  cancel-in-progress: false

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Static safety audit
        run: |
          set -euo pipefail
          node --check dpro-tutorial-core.js
          node --check dpro-tutorial-first10-data.js
          test "$(grep -o 'content_id:\"F10_' dpro-tutorial-first10-data.js | wc -l | tr -d ' ')" = "10"
          ! grep -E 'fetch\(|XMLHttpRequest|requestSubmit\(|\.submit\(|\.click\(' dpro-tutorial-core.js
          ! grep -E '/api/|/owner/|/staff/|/member/' dpro-tutorial-core.js

      - name: Fresh browser First10 QA
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/careplan-r3-http.log 2>&1 &
          cat > /tmp/careplan-r3-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:4173';
          const fixtures={
            'owner.html':`<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}.hidden{display:none!important}body{margin:0;font-family:sans-serif;min-height:1200px;padding:20px}.owner-nav{display:flex;gap:8px;overflow:auto}.client{display:block;margin:10px;padding:20px}</style><section id=loginPanel><button id=demoFill>デモ情報を入力</button><button id=loginButton>ログイン</button></section><section id=appPanel class=hidden><div id=summaryGrid>summary</div><nav class=owner-nav><button data-view=clients>利用者台帳</button></nav><section id=viewClients class=hidden><div id=clientList><button class=client>山田 太郎</button></div></section><section id=viewClientDetail class=hidden>基本情報 担当ケアマネ 要介護認定 ケアプラン進捗</section></section><script>demoFill.onclick=()=>{};loginButton.onclick=()=>{loginPanel.classList.add('hidden');appPanel.classList.remove('hidden')};document.querySelector('[data-view=clients]').onclick=()=>viewClients.classList.remove('hidden');document.querySelector('.client').onclick=()=>{viewClients.classList.add('hidden');viewClientDetail.classList.remove('hidden')}</script>`,
            'member.html':`<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>.hidden{display:none!important}body{font-family:sans-serif;min-height:900px}.dashboard{padding:30px}</style><section id=loginPanel><button id=demoLogin>山田様のご家族として体験</button></section><section id=portal class=hidden><div class=dashboard>訪問・面談予定 提出書類 事業所からの連絡</div></section><script>demoLogin.onclick=()=>{loginPanel.classList.add('hidden');portal.classList.remove('hidden')}</script>`,
            'staff.html':`<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>.hidden{display:none!important}body{font-family:sans-serif;min-height:1100px}.staff-nav{display:flex;gap:8px}.client{display:block;margin:10px;padding:20px}</style><section id=loginPanel><button id=demoFill>デモ情報を入力</button><button id=loginButton>ログイン</button></section><section id=appPanel class=hidden><nav class=staff-nav><button data-view=clients>担当利用者</button></nav><section id=viewClients class=hidden><div id=clientList><button class=client>山田 太郎</button></div></section><section id=viewDetail class=hidden><button id=newMonitoring>今月分を入力</button><form id=monitoringForm class=hidden><input><textarea></textarea><button type=button>下書き保存</button><button type=button>提出する</button></form></section></section><script>loginButton.onclick=()=>{loginPanel.classList.add('hidden');appPanel.classList.remove('hidden')};document.querySelector('[data-view=clients]').onclick=()=>viewClients.classList.remove('hidden');document.querySelector('.client').onclick=()=>{viewClients.classList.add('hidden');viewDetail.classList.remove('hidden')};newMonitoring.onclick=()=>monitoringForm.classList.remove('hidden')</script>`
          };

          const viewports=[
            {name:'desktop-1440',width:1440,height:1000},
            {name:'mobile-390',width:390,height:844},
            {name:'mobile-320',width:320,height:720},
            {name:'ipad-1024',width:1024,height:768}
          ];
          const results=[];

          for(const vp of viewports){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},locale:'ja-JP'});
            const page=await context.newPage();
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.route(`${base}/*`,async route=>{
              const u=new URL(route.request().url());
              const name=u.pathname.split('/').pop();
              if(fixtures[name])return route.fulfill({status:200,contentType:'text/html',body:fixtures[name]});
              return route.continue();
            });
            await page.goto(`${base}/tutorial.html?mode=replay`,{waitUntil:'networkidle'});
            const f=page.frameLocator('#featureFrame');
            const card=()=>f.locator('#dproTutorialCard');
            await card().waitFor();

            const before=await card().boundingBox();
            const hb=await f.locator('.dt-drag').boundingBox();
            await page.mouse.move(hb.x+20,hb.y+15); await page.mouse.down();
            await page.mouse.move(hb.x+85,hb.y+65); await page.mouse.up();
            const after=await card().boundingBox();
            const dragMoved=Math.abs(after.x-before.x)>20||Math.abs(after.y-before.y)>20;

            const b0=await card().boundingBox();
            const closeBox=await f.locator('[data-dt="close"]').boundingBox();
            await page.mouse.move(closeBox.x+10,closeBox.y+10); await page.mouse.down();
            await page.mouse.move(closeBox.x+45,closeBox.y+20);
            const b1=await card().boundingBox();
            const controlsNoDrag=Math.abs(b1.x-b0.x)<3&&Math.abs(b1.y-b0.y)<3;
            await page.mouse.up();
            const closeWorks=await f.locator('#dproTutorialCard').count()===0;
            await page.locator('#resumeTutorial').click(); await card().waitFor();

            await f.locator('#demoFill').click(); await f.locator('#loginButton').click(); await f.locator('[data-dt="next"]').click();
            await f.locator('[data-dt="next"]').click();
            await f.locator('[data-view="clients"]').click(); await f.locator('[data-dt="next"]').click();
            await f.locator('.client').click(); await f.locator('[data-dt="next"]').click();

            await f.locator('.dt-drag').press('Escape');
            const escWorks=await f.locator('#dproTutorialCard').count()===0;
            await page.locator('#resumeTutorial').click(); await card().waitFor();
            const resumedStep5=(await f.locator('.dt-top span').first().textContent()).includes('5/10');
            await f.locator('[data-dt="next"]').click();

            await f.locator('#demoLogin').click(); await f.locator('[data-dt="next"]').click();
            await f.locator('[data-dt="next"]').click();
            await f.locator('#demoFill').click(); await f.locator('#loginButton').click(); await f.locator('[data-dt="next"]').click();
            await f.locator('[data-view="clients"]').click(); await f.locator('.client').click(); await f.locator('[data-dt="next"]').click();

            const k0=await card().boundingBox();
            await f.locator('.dt-drag').focus(); await f.locator('.dt-drag').press('ArrowRight');
            const k1=await card().boundingBox();
            const keyboardMove=k1.x>k0.x+5;
            await f.locator('#newMonitoring').click(); await f.locator('[data-dt="next"]').click();
            const completed=await page.evaluate(()=>JSON.parse(localStorage.getItem('dpro_careplan_tutorial_first10_v1_1')||'null')?.state==='COMPLETED');

            await page.goto(`${base}/tutorial.html`,{waitUntil:'networkidle'});
            const resumeAfterNavigation=await page.evaluate(()=>JSON.parse(localStorage.getItem('dpro_careplan_tutorial_first10_v1_1')||'null')?.state==='COMPLETED');
            await page.locator('#replayTutorial').click(); await card().waitFor();
            await f.locator('[data-dt="skip"]').click();
            const skipped=await page.evaluate(()=>JSON.parse(localStorage.getItem('dpro_careplan_tutorial_first10_v1_1')||'null')?.state==='SKIPPED');
            await page.locator('#resumeTutorial').click(); await card().waitFor();
            const replayResumeWorks=(await f.locator('.dt-top span').first().textContent()).includes('1/10');

            const highlightClickable=await f.locator('[data-dpro-guide-active="1"]').evaluate(el=>getComputedStyle(el).pointerEvents!=='none');
            const metrics=await page.evaluate(()=>({innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)}));
            const frameMetrics=await f.locator('html').evaluate(el=>({innerWidth:el.ownerDocument.defaultView.innerWidth,scrollWidth:Math.max(el.scrollWidth,el.ownerDocument.body.scrollWidth)}));
            const cardBox=await card().boundingBox();
            const clampOk=cardBox.x>=0&&cardBox.y>=0&&cardBox.x+cardBox.width<=vp.width+1&&cardBox.y+cardBox.height<=vp.height+1;
            const overflowOk=metrics.scrollWidth<=metrics.innerWidth+1&&frameMetrics.scrollWidth<=frameMetrics.innerWidth+1;

            const pass=dragMoved&&controlsNoDrag&&closeWorks&&escWorks&&resumedStep5&&keyboardMove&&completed&&resumeAfterNavigation&&skipped&&replayResumeWorks&&highlightClickable&&clampOk&&overflowOk&&pageErrors.length===0&&consoleErrors.length===0;
            results.push({vp,dragMoved,controlsNoDrag,closeWorks,escWorks,resumedStep5,keyboardMove,completed,resumeAfterNavigation,skipped,replayResumeWorks,highlightClickable,clampOk,overflowOk,metrics,frameMetrics,pageErrors,consoleErrors,pass});
            await browser.close();
          }

          const report={checkedAt:new Date().toISOString(),sourceHead:process.env.GITHUB_SHA,first10Count:10,businessMutation:0,results,ok:results.every(x=>x.pass)};
          fs.mkdirSync('CAREPLAN_R3_QA',{recursive:true});
          fs.writeFileSync('CAREPLAN_R3_QA/R3_BROWSER_QA.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!report.ok)process.exit(1);
          JS
          node /tmp/careplan-r3-qa.mjs

      - name: Public Pages HTTP check
        if: success()
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -L -sS -o /tmp/tutorial.html -w '%{http_code}' "https://dpromstk2000-lab.github.io/dpro-careplan-line/tutorial.html?qa=${GITHUB_RUN_ID}" || true)
            if [ "$code" = "200" ] && grep -q 'CAREPLAN First10' /tmp/tutorial.html; then
              echo "Pages tutorial reachable"
              exit 0
            fi
            sleep 10
          done
          echo "Pages deployment not visible during QA window" >&2
          exit 1

      - name: Upload R3 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careplan-tutorial-r3-qa
          path: CAREPLAN_R3_QA/
          if-no-files-found: warn
          retention-days: 30
