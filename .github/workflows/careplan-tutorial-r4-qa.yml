name: CAREPLAN Tutorial R4 Guide Center QA

on:
  push:
    branches: [main]
    paths:
      - 'common.js'
      - 'guide-center.html'
      - 'guide-center.css'
      - 'guide-center.js'
      - '.github/workflows/careplan-tutorial-r4-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careplan-tutorial-r4-qa
  cancel-in-progress: false

jobs:
  guide-center-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Static Guide Center safety audit
        run: |
          set -euo pipefail
          node --check guide-center.js
          grep -q 'id="launchFirst10"' guide-center.html
          grep -q 'id="resumeFirst10"' guide-center.html
          grep -q 'id="replayFirst10"' guide-center.html
          grep -q 'system-check.html' guide-center.html
          grep -q 'guide-center.html' common.js
          grep -q 'dproGuideEntry' common.js
          ! grep -E 'fetch\(|XMLHttpRequest|requestSubmit\(|\.submit\(|\.click\(' guide-center.js
          ! grep -E '/api/|/owner/|/staff/|/member/' guide-center.js

      - name: Fresh browser Guide Center QA
        run: |
          set -euo pipefail
          python3 -m http.server 4174 >/tmp/careplan-r4-http.log 2>&1 &
          cat > careplan-r4-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:4174';
          const viewports=[
            {name:'desktop-1440',width:1440,height:1000},
            {name:'mobile-390',width:390,height:844},
            {name:'ipad-1024',width:1024,height:768}
          ];
          const results=[];

          for(const vp of viewports){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},locale:'ja-JP'});
            const page=await context.newPage();
            const pageErrors=[],consoleErrors=[],mutatingRequests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('request',r=>{if(!['GET','HEAD','OPTIONS'].includes(r.method()))mutatingRequests.push({method:r.method(),url:r.url()})});

            await page.goto(`${base}/guide-center.html`,{waitUntil:'networkidle'});
            const titleOk=(await page.locator('h1').textContent()).includes('操作ガイド');
            const requiredLinks=await page.evaluate(()=>({
              launch:document.getElementById('launchFirst10')?.getAttribute('href')||'',
              resume:document.getElementById('resumeFirst10')?.getAttribute('href')||'',
              replay:document.getElementById('replayFirst10')?.getAttribute('href')||'',
              system:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='system-check.html')
            }));
            const linksOk=requiredLinks.launch.includes('tutorial.html?mode=replay')&&requiredLinks.resume==='tutorial.html'&&requiredLinks.replay.includes('tutorial.html?mode=replay')&&requiredLinks.system;

            await page.locator('#guideSearch').fill('モニタリング');
            const searchCount=await page.locator('#articleGrid .gc-card').count();
            await page.locator('#guideSearch').fill('');
            await page.locator('#roleFilter').selectOption({label:'ケアマネ'});
            const roleCount=await page.locator('#articleGrid .gc-card').count();
            const roleTexts=await page.locator('#articleGrid .gc-card').allTextContents();
            const filterOk=searchCount>0&&roleCount>0&&roleTexts.every(t=>t.includes('ケアマネ'));
            await page.locator('#roleFilter').selectOption('');

            await page.locator('#guideSearch').focus();
            await page.keyboard.press('Tab');
            const keyboardFocus=await page.evaluate(()=>document.activeElement?.id==='roleFilter');

            await page.evaluate(()=>localStorage.setItem('dpro_careplan_tutorial_first10_v1_1',JSON.stringify({state:'IN_PROGRESS',index:4,route:'owner.html'})));
            await page.reload({waitUntil:'networkidle'});
            const statusText=await page.locator('#first10Status').textContent();
            const resumeStatusOk=statusText.includes('進行中')&&statusText.includes('5/10');

            const metrics=await page.evaluate(()=>({innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)}));
            const overflowOk=metrics.scrollWidth<=metrics.innerWidth+1;

            await page.goto(`${base}/index.html`,{waitUntil:'networkidle'});
            const guideEntry=page.locator('#dproGuideEntry');
            const guideEntryVisible=await guideEntry.isVisible();
            const guideEntryHref=await guideEntry.getAttribute('href');
            const indexMetrics=await page.evaluate(()=>({innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)}));
            const entryOk=guideEntryVisible&&guideEntryHref==='guide-center.html'&&indexMetrics.scrollWidth<=indexMetrics.innerWidth+1;
            await guideEntry.click();
            await page.waitForURL(/guide-center\.html/);
            const entryNavigationOk=page.url().includes('guide-center.html');

            const targetFiles=['tutorial.html','demo-guide.html','system-check.html','index.html','member.html','staff.html','owner.html','owner-ipad.html'];
            const linkChecks=[];
            for(const file of targetFiles){
              const r=await context.request.get(`${base}/${file}`);
              linkChecks.push({file,status:r.status(),ok:r.ok()});
            }
            const brokenLinksOk=linkChecks.every(x=>x.ok);

            await page.goto(`${base}/guide-center.html`,{waitUntil:'networkidle'});
            await page.locator('#launchFirst10').click();
            await page.waitForURL(/tutorial\.html\?mode=replay/);
            const launchWorks=page.url().includes('tutorial.html?mode=replay');
            await page.goto(`${base}/guide-center.html`,{waitUntil:'networkidle'});
            const noMutation=mutatingRequests.length===0;

            const pass=titleOk&&linksOk&&filterOk&&keyboardFocus&&resumeStatusOk&&overflowOk&&entryOk&&entryNavigationOk&&brokenLinksOk&&launchWorks&&noMutation&&pageErrors.length===0&&consoleErrors.length===0;
            results.push({vp,titleOk,linksOk,filterOk,searchCount,roleCount,keyboardFocus,resumeStatusOk,overflowOk,metrics,entryOk,entryNavigationOk,brokenLinksOk,linkChecks,launchWorks,noMutation,mutatingRequests,pageErrors,consoleErrors,pass});
            await browser.close();
          }

          const report={checkedAt:new Date().toISOString(),sourceHead:process.env.GITHUB_SHA,businessMutation:0,results,ok:results.every(x=>x.pass)};
          fs.mkdirSync('CAREPLAN_R4_QA',{recursive:true});
          fs.writeFileSync('CAREPLAN_R4_QA/R4_BROWSER_QA.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!report.ok)process.exit(1);
          JS
          node careplan-r4-qa.mjs

      - name: Public Pages Guide Center HTTP check
        if: success()
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -L -sS -o /tmp/guide-center.html -w '%{http_code}' "https://dpromstk2000-lab.github.io/dpro-careplan-line/guide-center.html?qa=${GITHUB_RUN_ID}" || true)
            common_code=$(curl -L -sS -o /tmp/common.js -w '%{http_code}' "https://dpromstk2000-lab.github.io/dpro-careplan-line/common.js?qa=${GITHUB_RUN_ID}" || true)
            if [ "$code" = "200" ] && [ "$common_code" = "200" ] && grep -q '操作ガイド' /tmp/guide-center.html && grep -q 'dproGuideEntry' /tmp/common.js; then
              echo "Pages Guide Center reachable"
              exit 0
            fi
            sleep 10
          done
          echo "Pages Guide Center deployment not visible during QA window" >&2
          exit 1

      - name: Upload R4 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careplan-tutorial-r4-qa
          path: CAREPLAN_R4_QA/
          if-no-files-found: warn
          retention-days: 30
