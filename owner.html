<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2942"><meta name="robots" content="noindex,nofollow"><title>DPRO 居宅介護支援｜事業所ログイン</title><link rel="stylesheet" href="styles.css"></head><body><header class="hero"><div class="wrap"><div class="brand"><span class="brand-mark">D</span><span><strong>DPRO CARE PLAN</strong><small>事業所・管理者認証</small></span></div><div class="hero-copy"><p class="eyebrow">OWNER AUTHENTICATION</p><h1>事業所管理画面へ<br>安全にログイン。</h1><div class="hero-links"><a class="hero-link ghost" href="index.html">← LINE入口へ戻る</a></div></div></div></header><main class="main"><div class="wrap"><div id="status" class="status" role="alert" aria-live="polite"></div><section id="loginPanel" class="card login-box"><h2>管理者ログイン</h2><p class="hint">このSTEPでは、CAREPLAN-2で作成した認証・セッション・権限分離を実画面から確認します。</p><form id="loginForm"><div class="field"><label for="organizationCode">事業所コード</label><input class="control" id="organizationCode" maxlength="64"></div><div class="field"><label for="staffCode">職員コード</label><input class="control" id="staffCode" maxlength="64"></div><div class="field"><label for="accessCode">管理コード</label><div class="code-row"><input class="control" id="accessCode" type="password" inputmode="numeric" maxlength="128"><button id="clearCode" class="clear-btn" type="button">削除</button></div></div><div class="button-row"><button id="demoFill" class="btn secondary" type="button">デモ情報を入力</button><button id="loginButton" class="btn primary" type="submit">ログイン</button></div></form></section><section id="authPanel" class="hidden"><div class="card profile"><div><span class="badge">認証済み</span><div id="staffName" class="profile-name"></div><p id="staffRole" class="muted"></p><p id="orgName" class="muted"></p></div><button id="logout" class="btn danger" type="button">ログアウト</button></div><section class="card"><div class="section-head"><h2>API・データベース確認</h2><button id="reloadCheck" class="btn secondary" type="button">再検査</button></div><div id="healthGrid" class="health-grid"></div><p class="hint">利用者台帳、認定期限、計画進捗などの本格管理画面はCAREPLAN-5で追加します。</p></section></section></div></main><footer class="footer"><span id="version"></span></footer><script src="config.js"></script><script src="common.js"></script><script src="owner.js"></script></body></html>
